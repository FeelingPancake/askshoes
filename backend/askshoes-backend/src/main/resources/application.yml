spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Page<T> из контроллеров сериализуется как стабильный PagedModel:
        # { content, page: { size, number, totalElements, totalPages } }
        serialization-mode: via-dto
springdoc:
  default-produces-media-type: application/json
argent:
  storage:
    root-path: ./storage-data
  auth:
    registration:
      enabled: true
      default-roles:
        - ADMIN